<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>märz · leads</title>
<meta name="theme-color" content="#12100f">
<link rel="manifest" href="/admin.webmanifest">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<link rel="stylesheet" href="/vendor/fa/fa.min.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#12100f;--bg2:#1b1917;--bg3:#241f1d;--line:#332d2a;--line2:#443c38;
  --txt:#f2ece7;--muted:#b0a49c;--dim:#8b7d74;--coral:#ff5c66;--coral2:#ff8088;--ok:#5cc26a;--gold:#e6b34d;
  --sans:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:ui-monospace,'SFMono-Regular','Cascadia Code',Menlo,Consolas,monospace;
}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--txt);font-family:var(--sans);line-height:1.5;
  padding-top:env(safe-area-inset-top);min-height:100dvh}
a{color:inherit}
.topbar{position:sticky;top:0;z-index:20;background:rgba(18,16,15,.9);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);display:flex;align-items:center;gap:.7rem;padding:.85rem 1.1rem}
.topbar .logo{font-family:var(--mono);font-weight:700}.topbar .logo b{color:var(--coral)}
.topbar .count{font-family:var(--mono);font-size:.78rem;color:var(--dim);background:var(--bg3);
  border:1px solid var(--line2);border-radius:999px;padding:.15rem .55rem}
.topbar .sp{margin-left:auto}
.ibtn{background:var(--bg3);border:1px solid var(--line2);color:var(--txt);width:38px;height:38px;
  border-radius:10px;cursor:pointer;font-size:.95rem;display:inline-flex;align-items:center;justify-content:center;
  transition:border-color .14s,background .14s}
.ibtn:hover{border-color:var(--coral)}
.ibtn:focus-visible{outline:2px solid var(--coral2);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:1.1rem}
/* push banner */
.pbanner{display:flex;align-items:center;gap:.7rem;background:var(--bg2);border:1px solid var(--line2);
  border-radius:14px;padding:.85rem 1rem;margin-bottom:1.1rem}
.pbanner i{color:var(--coral);font-size:1.1rem}
.pbanner .tx{flex:1;font-size:.88rem;color:var(--muted)}
.pbanner .tx b{color:var(--txt)}
.btn{font-family:inherit;font-weight:650;font-size:.88rem;border-radius:9px;border:2px solid transparent;
  padding:.5rem .9rem;cursor:pointer;display:inline-flex;align-items:center;gap:.4rem;transition:transform .12s,background .14s,border-color .14s;white-space:nowrap}
.btn:active{transform:translateY(1px)}
.btn:focus-visible{outline:2px solid var(--coral2);outline-offset:2px}
.btn-primary{background:var(--coral);color:var(--bg)}.btn-primary:hover{background:var(--coral2)}
.btn-ghost{background:transparent;border-color:var(--line2);color:var(--txt)}.btn-ghost:hover{border-color:var(--coral)}
/* stat chips */
.chips{display:flex;gap:.6rem;flex-wrap:wrap;margin-bottom:1.1rem}
.chip{flex:1;min-width:110px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:.7rem .85rem}
.chip .n{font-family:var(--mono);font-weight:800;font-size:1.5rem;color:var(--coral);line-height:1}
.chip .l{font-size:.72rem;color:var(--dim);margin-top:.25rem;font-family:var(--mono)}
/* search */
.search{position:relative;margin-bottom:1rem}
.search i{position:absolute;left:.85rem;top:50%;transform:translateY(-50%);color:var(--dim)}
.search input{width:100%;background:var(--bg2);border:1px solid var(--line2);border-radius:10px;
  color:var(--txt);font:inherit;font-size:.95rem;padding:.65rem .8rem .65rem 2.3rem;outline:none;transition:border-color .14s}
.search input:focus{border-color:var(--coral)}
/* lead cards */
.lead{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:1rem 1.05rem;margin-bottom:.8rem;
  transition:border-color .14s,transform .14s}
.lead:hover{border-color:var(--line2)}
.lead .h{display:flex;align-items:baseline;gap:.6rem;flex-wrap:wrap}
.lead .name{font-weight:750;font-size:1.05rem}
.lead .when{margin-left:auto;font-family:var(--mono);font-size:.72rem;color:var(--dim)}
.lead .email{font-family:var(--mono);font-size:.82rem;color:var(--coral2);word-break:break-all}
.lead .msg{margin:.6rem 0;color:var(--muted);font-size:.92rem;white-space:pre-wrap;overflow-wrap:anywhere}
.lead .meta{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.5rem}
.tagp{font-family:var(--mono);font-size:.7rem;color:var(--dim);border:1px solid var(--line2);
  border-radius:999px;padding:.12rem .55rem;display:inline-flex;align-items:center;gap:.3rem}
.tagp.irl{color:var(--gold);border-color:#4a3f27}
.tagp.ch{color:var(--coral2);border-color:#5a2e30}
.lead .acts{display:flex;gap:.5rem;margin-top:.7rem;flex-wrap:wrap}
.lead .acts a{font-family:var(--mono);font-size:.78rem;color:var(--muted);border:1px solid var(--line2);
  border-radius:8px;padding:.3rem .6rem;transition:color .14s,border-color .14s;text-decoration:none}
.lead .acts a:hover{color:var(--coral);border-color:var(--coral)}
.empty{text-align:center;color:var(--dim);padding:3rem 1rem;font-family:var(--mono);font-size:.9rem}
.empty i{font-size:2rem;display:block;margin-bottom:.7rem;color:var(--line2)}
/* login gate */
.gate{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:1.4rem;z-index:50}
.gate .card{background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:1.8rem;max-width:360px;width:100%;text-align:center}
.gate .lock{font-size:2rem;color:var(--coral);margin-bottom:.9rem}
.gate h1{font-size:1.3rem;margin-bottom:.4rem}
.gate p{color:var(--dim);font-size:.85rem;margin-bottom:1.2rem}
.gate input{width:100%;background:var(--bg3);border:1px solid var(--line2);border-radius:10px;color:var(--txt);
  font:inherit;font-family:var(--mono);padding:.7rem .8rem;outline:none;margin-bottom:.8rem;text-align:center}
.gate input:focus{border-color:var(--coral)}
.gate .btn{width:100%;justify-content:center}
.gate .err{color:var(--coral);font-size:.8rem;min-height:1.1rem;margin-bottom:.6rem}
.toast{position:fixed;left:50%;bottom:calc(1.2rem + env(safe-area-inset-bottom));transform:translateX(-50%);
  background:var(--bg3);border:1px solid var(--line2);border-radius:10px;padding:.65rem 1rem;font-size:.85rem;
  z-index:60;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="gate" id="gate" hidden>
  <div class="card">
    <div class="lock"><i class="fa-solid fa-lock"></i></div>
    <h1>märz · leads</h1>
    <p>Admin access. Paste your token.</p>
    <div class="err" id="gerr"></div>
    <input id="tok" type="password" placeholder="admin token" autocomplete="current-password" enterkeyhint="go">
    <button class="btn btn-primary" id="login"><i class="fa-solid fa-arrow-right-to-bracket"></i> unlock</button>
  </div>
</div>

<div class="topbar">
  <span class="logo">tay<b>.</b>märz</span>
  <span class="count" id="count">—</span>
  <span class="sp"></span>
  <button class="ibtn" id="refresh" title="Refresh"><i class="fa-solid fa-rotate"></i></button>
  <button class="ibtn" id="bell" title="Enable notifications"><i class="fa-solid fa-bell"></i></button>
</div>

<main class="wrap" id="app" hidden>
  <div class="pbanner" id="pbanner" hidden>
    <i class="fa-solid fa-bell-slash"></i>
    <div class="tx"><b>Push is off.</b> Turn it on to get pinged the moment a lead lands.</div>
    <button class="btn btn-primary" id="enablePush">Enable</button>
  </div>

  <div class="chips">
    <div class="chip"><div class="n" id="cTotal">0</div><div class="l">total leads</div></div>
    <div class="chip"><div class="n" id="cWeek">0</div><div class="l">last 7 days</div></div>
    <div class="chip"><div class="n" id="cIrl">0</div><div class="l">want IRL</div></div>
  </div>

  <div class="search">
    <i class="fa-solid fa-magnifying-glass"></i>
    <input id="q" type="search" placeholder="search name, email, message…" enterkeyhint="search">
  </div>

  <div id="list"></div>
</main>

<div class="toast" id="toast"></div>
<script src="/admin.js"></script>
</body>
</html>
